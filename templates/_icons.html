{% macro icon(name, size=20, stroke=1.85) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ stroke }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == 'grid' %}
    <rect x="3" y="3" width="7" height="7" rx="1.5"/>
    <rect x="14" y="3" width="7" height="7" rx="1.5"/>
    <rect x="3" y="14" width="7" height="7" rx="1.5"/>
    <rect x="14" y="14" width="7" height="7" rx="1.5"/>
  {% elseif name == 'books' %}
    <rect x="3" y="4" width="5" height="16" rx="1"/>
    <rect x="9.5" y="5" width="5" height="15" rx="1"/>
    <path d="m16 4 5 1.5-3 14.5-5-1.5"/>
    <path d="M5 7h1M11.5 8h1"/>
  {% elseif name == 'bookmark' %}
    <path d="M6 3h12v18l-6-4-6 4V3Z"/>
  {% elseif name == 'chart' %}
    <path d="M3 20h18M6 16v-6m6 6V4m6 12v-9"/>
  {% elseif name == 'history' %}
    <path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l4 2"/>
  {% elseif name == 'bell' %}
    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
    <path d="M10 21h4"/>
  {% elseif name == 'user' %}
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21a8 8 0 0 1 16 0"/>
  {% elseif name == 'moon' %}
    <path d="M20.5 13.3A9 9 0 0 1 10.7 3.5a9 9 0 1 0 9.8 9.8Z"/>
  {% elseif name == 'sun' %}
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/>
  {% elseif name == 'logout' %}
    <path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5m7-4 4-4-4-4m4 4H9"/>
  {% elseif name == 'mail' %}
    <rect x="2" y="4" width="20" height="16" rx="2"/>
    <path d="m2 6 10 7 10-7"/>
  {% elseif name == 'lock' %}
    <rect x="4" y="11" width="16" height="11" rx="2"/>
    <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
  {% elseif name == 'globe' %}
    <circle cx="12" cy="12" r="9"/>
    <path d="M3 12h18M12 3c-6 5-6 13 0 18M12 3c6 5 6 13 0 18"/>
  {% elseif name == 'activity' %}
    <path d="M3 12h4l3-7 4 14 3-7h4"/>
  {% elseif name == 'arrow-up-right' %}
    <path d="M7 17 17 7M8 7h9v9"/>
  {% elseif name == 'arrow-right' %}
    <path d="M5 12h14m-6-6 6 6-6 6"/>
  {% elseif name == 'arrow-left' %}
    <path d="M19 12H5m6-6-6 6 6 6"/>
  {% elseif name == 'chevron-down' %}
    <path d="m6 9 6 6 6-6"/>
  {% elseif name == 'chevron-right' %}
    <path d="m9 18 6-6-6-6"/>
  {% elseif name == 'play' %}
    <path d="m8 5 12 7-12 7V5Z"/>
  {% elseif name == 'refresh' %}
    <path d="M20 11a8 8 0 0 0-14-5L3 9M3 4v5h5"/>
    <path d="M4 13a8 8 0 0 0 14 5l3-3m0 5v-5h-5"/>
  {% elseif name == 'clock' %}
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7v5l3 2"/>
  {% elseif name == 'check' %}
    <path d="m5 12 4 4L19 6"/>
  {% elseif name == 'check-circle' %}
    <circle cx="12" cy="12" r="9"/>
    <path d="m8 12 2.5 2.5L16 9"/>
  {% elseif name == 'alert' %}
    <path d="m12 3 10 18H2L12 3Z"/>
    <path d="M12 9v4m0 4h.01"/>
  {% elseif name == 'shield' %}
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>
    <path d="m9 12 2 2 4-4"/>
  {% elseif name == 'database' %}
    <ellipse cx="12" cy="5" rx="9" ry="3"/>
    <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>
  {% elseif name == 'search' %}
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="m16 16 5 5"/>
  {% elseif name == 'eye' %}
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
    <circle cx="12" cy="12" r="3"/>
  {% elseif name == 'eye-off' %}
    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
    <line x1="1" y1="1" x2="23" y2="23"/>
  {% elseif name == 'filter' %}
    <path d="M4 6h16M7 12h10m-7 6h4"/>
  {% elseif name == 'menu' %}
    <path d="M4 6h16M4 12h16M4 18h16"/>
  {% elseif name == 'close' %}
    <path d="M5 5l14 14M19 5 5 19"/>
  {% elseif name == 'settings' %}
    <path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M18.4 5.6l-2.1 2.1m-8.6 8.6-2.1 2.1"/>
    <circle cx="12" cy="12" r="4"/>
  {% elseif name == 'external' %}
    <path d="M13 5h6v6m0-6-9 9"/>
    <path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/>
  {% elseif name == 'code' %}
    <path d="m8 8-4 4 4 4m8-8 4 4-4 4m-3-11-2 14"/>
  {% elseif name == 'star' %}
    <path d="m12 2 3.1 6.3 7 .9-5 4.9 1.2 7-6.3-3.3-6.3 3.3 1.2-7-5-4.9 7-.9L12 2Z"/>
  {% elseif name == 'file-text' %}
    <path d="M6 2h8l5 5v14H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z"/>
    <path d="M14 2v6h5M8 12h8M8 16h8"/>
  {% elseif name == 'layers' %}
    <path d="m12 2 10 6-10 6L2 8l10-6Zm-10 11 10 6 10-6m-20 5 10 6 10-6"/>
  {% elseif name == 'bolt' %}
    <path d="m13 2-9 11h7l-1 9 10-12h-7l0-8Z"/>
  {% elseif name == 'sort' %}
    <path d="m7 3-4 4 4 4M3 7h13M17 21l4-4-4-4m4 4H8"/>
  {% else %}
    <circle cx="12" cy="12" r="9"/>
  {% endif %}
</svg>
{%- endmacro %}
